SPECIFICATION Spec
\* model/hourly_mutants.py's config: Hourly.cfg's rules at auto 2 and hand 2 (legacy 3), so each mutant checks in
\* seconds. Every pass step still runs (each pool full, and free).
CONSTANTS Issues = {i1, i2} Auto = 2 Hand = 2 Legacy = 3 MaxQuick = 1 MaxQueued = 2
INVARIANT TypeOK
INVARIANT NoSilentPassWhenCouldPick
INVARIANT NoSilentPassWhileStalled
INVARIANT PicksOrSkipsEachTodo
INVARIANT AutoCap
INVARIANT HandCap
INVARIANT QuickNotCounted
INVARIANT HeldOrZaneNeverPicked
INVARIANT NoAutoOnPausedPeer
INVARIANT EveryPassLogs

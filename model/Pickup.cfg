SPECIFICATION Spec
\* The pools in config/policy.toml [slots] (auto 3, hand 5), with runs from earlier passes one short of each. Three items
\* (one foreign: another launcher's brief), two passes (launchd's and a hand run), one chat-started run and three of the
\* five skip rules ("held" and "zane" must be in it; "overlap" and "host" act as "pr" does): run it with PICKUP_FULL=1
\* tests/pickup-model.sh. CI checks the same rules on Small.cfg; Liveness.cfg checks the temporal rules.
CONSTANTS Items = {i1, i2, i3} Passes = {p1, p2} NoPass = NoPass Auto = 3 Hand = 5 MaxChat = 1 Rules = {"held", "zane", "pr"} Foreign = {i3}
SYMMETRY PassSym
INVARIANT TypeOK
INVARIANT NoOverlap
INVARIANT NoSilentPassWhenCouldPick
INVARIANT CapsHold
INVARIANT HeldNeverPicked
INVARIANT NoResultLost
INVARIANT ForeignNeverLaunched
PROPERTY WakeIffOutputOrFailure
PROPERTY OutputIsNew

SPECIFICATION Spec
\* The caps in config/policy.toml [slots], with runs from earlier passes one auto slot and two total slots short of them. Two items,
\* two passes (launchd's and a hand run), one chat-started run and three of the five skip rules ("held" and "zane" must
\* be in it; "overlap" and "host" act as "pr" does) keep TLC near 23 million states, about 7 minutes on 6 workers: run it
\* with PICKUP_FULL=1 tests/pickup-model.sh. CI checks the same rules on Small.cfg; Liveness.cfg checks the temporal rules.
CONSTANTS Items = {i1, i2} Passes = {p1, p2} NoPass = NoPass Total = 7 Auto = 5 MaxChat = 1 Rules = {"held", "zane", "pr"}
SYMMETRY PassSym
INVARIANT TypeOK
INVARIANT NoOverlap
INVARIANT NoSilentPassWhenCouldPick
INVARIANT CapsHold
INVARIANT HeldNeverPicked
INVARIANT NoResultLost
PROPERTY WakeIffOutputOrFailure
PROPERTY OutputIsNew

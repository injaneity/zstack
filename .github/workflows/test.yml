name: test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: scripts parse
        run: |
          for f in bin/*.sh; do bash -n "$f"; done
      - name: skills and agent types have frontmatter
        run: |
          fail=0
          for f in skills/*/SKILL.md agents/*.md; do
            head -1 "$f" | grep -qx -- '---' || { echo "no frontmatter: $f"; fail=1; }
          done
          exit $fail
      - name: agent types name no model
        run: |
          if grep -n '^models\?:' agents/*.md; then echo "set models in pi's config, not here"; exit 1; fi
      - name: every agent the docs name exists
        run: |
          names=$(sed -n 's/^name: *//p' agents/*.md; ls skills prompts | sed 's/\.md$//')
          fail=0
          while IFS=: read -r file name; do
            echo "$names" | grep -qx -- "$name" || { echo "$file names \`$name\` but no agent, skill or prompt has that name"; fail=1; }
          done < <(grep -roE '`(zstack|onigiri)-[a-z0-9-]+`' --include='*.md' skills prompts docs README.md AGENTS.md | tr -d '`' | sort -u)
          exit $fail
      - name: every skill and playbook the docs name exists
        run: |
          skills=$(ls skills)
          agents=$(sed -n 's/^name: *//p' agents/*.md)
          fail=0
          while IFS=: read -r file ref; do
            name=$(echo "$ref" | sed -E 's#^\*\*`?##; s#`?\*\*$##; s#^/skill:##; s#^\.\./##; s#^skills/##; s#/SKILL\.md$##; s#/$##')
            echo "$agents" | grep -qx -- "$name" && [[ $ref == \*\** ]] && continue
            echo "$skills" | grep -qx -- "$name" || { echo "$file names skill \`$name\` but skills/$name/SKILL.md does not exist"; fail=1; }
          done < <(grep -roE '\*\*`?[a-z]+(-[a-z]+)*`?\*\*|/skill:[a-z-]+|\.\./[a-z-]+/SKILL\.md|skills/[a-z-]+/' --include='*.md' skills prompts docs agents README.md AGENTS.md | sort -u)
          while IFS=: read -r file ref; do
            name=$(echo "$ref" | sed -E 's#^playbooks/##; s#\.md$##; s#^\(`##; s#`\)$##')
            [ -f "skills/onigiri-mode/playbooks/$name.md" ] || { echo "$file names playbook \`$name\` but skills/onigiri-mode/playbooks/$name.md does not exist"; fail=1; }
          done < <(grep -HoE 'playbooks/[a-z-]+\.md|\(`[a-z-]+`\)' skills/onigiri-mode/SKILL.md | sort -u)
          exit $fail

name: test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  oldest-python:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - name: python3 is 3.9
        run: python3 -c 'import sys; assert sys.version_info[:2] == (3, 9), sys.version'
      - name: scripts parse under 3.9
        run: |
          for f in bin/* hosts/*/*; do
            case "$(head -1 "$f")" in *python3*) python3 -m py_compile "$f";; esac
          done
      - name: bin/policy reads config/policy.toml under 3.9 (vendor/tomli)
        run: bin/policy check && bin/policy get slots.hand && bin/policy dump > /dev/null && bin/policy rules > /dev/null
      - name: bin/hourly starts under 3.9 (the queue pass dry, and the facts a peer is asked for)
        env:
          ZSTACK_ENSURED: "1"
          ONIGIRI_HOST: ""
          ONIGIRI_ROOT: ${{ runner.temp }}/root
        run: PI_RUN_DRY=1 bin/hourly queue && bin/hourly facts
      - name: bin/pickup starts under 3.9 (a dry pass)
        env:
          ZSTACK_ENSURED: "1"
          ONIGIRI_HOST: ""
          ONIGIRI_ROOT: ${{ runner.temp }}/root
        run: bin/pickup --dry
      - name: the suite passes under 3.9
        run: python3 -m unittest discover -s tests -p 'test_*.py'
      - name: model config resolves under 3.9
        run: tests/models.sh

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: scripts parse
        run: |
          for f in bin/* hosts/*/*; do
            case "$(head -1 "$f")" in
              *python3*) python3 -m py_compile "$f";;
              '#!/bin/bash'*) bash -n "$f";;
            esac
          done
      - name: config/policy.toml, rules.toml and state.toml are valid (bin/policy check, the one parser)
        run: bin/policy check && bin/policy rules > /dev/null
      - name: merge job, patent hook, wake, pi-run lifecycle, hourly and pickup passes, hold-row, check-host, policy, config-reference and declarative-config tests
        run: python3 -m unittest discover -s tests -p 'test_*.py'
      - name: zstack code carries no comments
        run: python3 tests/comments.py check
      - name: lint the VM host scripts
        run: |
          pipx run ruff==0.17.3 check hosts/vm tests bin/pi-run bin/hourly bin/pickup bin/check-host bin/hold-row bin/policy bin/PiRun.mutants.py model
          shellcheck hosts/vm/cron-wrap.sh hosts/vm/pre-push hosts/*/host.sh hosts/mini/sync-from-vm.sh hosts/mini/vm tests/sync-from-vm.sh hosts/check-parity tests/check-parity.sh bin/ensure-package-main bin/new-brief tests/ensure-package-main.sh tests/pirun-model.sh tests/zstack-model.sh tests/models.sh hosts/mini/install-pickup.sh tests/pickup-model.sh tests/hourly-model.sh
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: rule guard blocks force-push, hook skips, merge-job merges and holds-file writes
        run: node --test tests/rule-guard.test.ts
      - name: subagent children get their role prompt and no session rules
        run: node --test tests/subagent-prompt.test.ts
      - name: a bash call with no timeout is bounded by run.idle_min
        run: node --test tests/tool-guard.test.ts
      - name: model config resolves
        run: tests/models.sh
      - name: pi-run fast-forwards the package to origin/main or refuses to start
        run: tests/ensure-package-main.sh
      - name: check-parity fails a host whose package, hook or agents differ from main
        run: tests/check-parity.sh
      - name: concurrent mini launches sync the holds copy without racing
        run: tests/sync-from-vm.sh
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: TLC passes bin/PiRun.tla, bin/PiRun.mmd is its chart and every mutant fails (bin/pi-run is held to the chart by test_pi_run.py)
        run: |
          curl -fsSL -o "$RUNNER_TEMP/tla2tools.jar" https://github.com/tlaplus/tlaplus/releases/download/v1.7.4/tla2tools.jar
          echo "936a262061c914694dfd669a543be24573c45d5aa0ff20a8b96b23d01e050e88  $RUNNER_TEMP/tla2tools.jar" | sha256sum -c -
          TLA2TOOLS="$RUNNER_TEMP/tla2tools.jar" JAVA=java tests/pirun-model.sh
      - name: TLC passes model/Zstack.tla, every mutant fails on its rule, and the Race.cfg probe still breaks
        run: TLA2TOOLS="$RUNNER_TEMP/tla2tools.jar" JAVA=java tests/zstack-model.sh
      - name: TLC passes model/Hourly.tla (the hourly pickup), model/Hourly.mmd is its chart, and every mutant fails on its rule
        run: TLA2TOOLS="$RUNNER_TEMP/tla2tools.jar" JAVA=java tests/hourly-model.sh
      - name: TLC passes model/Pickup.tla (the scheduled pickup pass), model/Pickup.mmd is its chart, and every mutant fails on its rule
        run: TLA2TOOLS="$RUNNER_TEMP/tla2tools.jar" JAVA=java tests/pickup-model.sh
      - name: the merge gate is three checks, and verification is not one of them
        run: |
          if bin/policy rules | cat - skills/onigiri-mode/playbooks/pull-requests.md skills/onigiri-mode/SKILL.md |
              grep -niE 'merg[a-z]* needs `?(pass|verif)|verif[a-z]* .*must be recorded|needs .*verified|verdict covers|verified.*(before|to) merg|merge.*(requires|needs).*verif'; then
            echo "a line above makes verification a merge condition"; exit 1
          fi
      - name: skills and agent types have frontmatter
        run: |
          fail=0
          for f in skills/*/SKILL.md skills/cua/*/SKILL.md agents/*.md; do
            head -1 "$f" | grep -qx -- '---' || { echo "no frontmatter: $f"; fail=1; }
          done
          exit $fail
      - name: agent types name no model
        run: |
          if grep -n '^models\?:' agents/*.md; then echo "set models in pi's config, not here"; exit 1; fi
      - name: every agent the docs name exists
        run: |
          names=$(sed -n 's/^name: *//p' agents/*.md; ls skills prompts | sed 's/\.md$//')
          fail=0
          while IFS=: read -r file name; do
            echo "$names" | grep -qx -- "$name" || { echo "$file names \`$name\` but no agent, skill or prompt has that name"; fail=1; }
          done < <(grep -roE '`(zstack|onigiri)-[a-z0-9-]+`' --include='*.md' skills prompts docs README.md AGENTS.md | tr -d '`' | sort -u)
          exit $fail
      - name: every skill and playbook the docs name exists
        run: |
          verbatim='^skills/(statechart/|create-formal-verification-skill/|maintain-formal-verification-skill/|cua/)'
          agents=$(sed -n 's/^name: *//p' agents/*.md)
          fail=0
          while IFS=: read -r file ref; do
            name=$(echo "$ref" | sed -E 's#^\*\*`?##; s#`?\*\*$##; s#^/skill:##; s#^\.\./##; s#^skills/##; s#/SKILL\.md$##; s#/$##')
            [[ $ref == .cursor/* || $ref == .pi/* ]] && continue
            [[ $ref == \*\** ]] && [[ $file =~ $verbatim ]] && continue
            [[ $ref == \*\** ]] && echo "$agents" | grep -qx -- "$name" && continue
            [ "$name" = cua ] && [ -d skills/cua ] && continue
            [ -f "skills/$name/SKILL.md" ] || [ -f "skills/cua/$name/SKILL.md" ] || { echo "$file names skill \`$name\` but skills/$name/SKILL.md does not exist"; fail=1; }
          done < <(grep -roE '\*\*`?[a-z]+(-[a-z]+)*`?\*\*|/skill:[a-z-]+|\.\./[a-z-]+/SKILL\.md|(\.cursor/|\.pi/)?skills/[a-z-]+/' --include='*.md' skills prompts docs agents README.md AGENTS.md | sort -u)
          while IFS=: read -r file ref; do
            name=$(echo "$ref" | sed -E 's#^playbooks/##; s#\.md$##; s#^\(`##; s#`\)$##')
            [ -f "skills/onigiri-mode/playbooks/$name.md" ] || { echo "$file names playbook \`$name\` but skills/onigiri-mode/playbooks/$name.md does not exist"; fail=1; }
          done < <({ grep -roE 'playbooks/[a-z-]+\.md' --include='*.md' skills prompts docs agents README.md AGENTS.md || true; grep -HoE '\(`[a-z-]+`\)' skills/onigiri-mode/SKILL.md || true; } | sort -u)
          exit $fail

name: test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: scripts parse
        run: |
          for f in bin/* hosts/*/*; do
            case "$(head -1 "$f")" in
              *python3*) python3 -m py_compile "$f";;
              '#!/bin/bash'*) bash -n "$f";;
            esac
          done
      - name: merge job and patent hook tests
        run: python3 -m unittest discover -s tests -p 'test_*.py'
      - name: lint the VM host scripts
        run: |
          pipx run ruff==0.17.3 check hosts/vm tests
          shellcheck hosts/vm/cron-wrap.sh hosts/vm/pre-push bin/ensure-package-main tests/ensure-package-main.sh bin/ensure-extensions tests/ensure-extensions.sh tests/launch-wake.sh
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: find guard refuses whole-disk and whole-home finds
        run: node --test tests/find-guard.test.ts
      - name: model config resolves and check-models flags a mismatch
        run: tests/models.sh
      - name: launchers fast-forward the package to origin/main or refuse to start
        run: tests/ensure-package-main.sh
      - name: launchers install the pinned extensions or refuse to start
        run: tests/ensure-extensions.sh
      - name: launchers wake onigiri only when pi fails and keep its exit code
        run: tests/launch-wake.sh
      - name: skills and agent types have frontmatter
        run: |
          fail=0
          for f in skills/*/SKILL.md agents/*.md; do
            head -1 "$f" | grep -qx -- '---' || { echo "no frontmatter: $f"; fail=1; }
          done
          exit $fail
      - name: agent types name no model
        run: |
          if grep -n '^models\?:' agents/*.md; then echo "set models in pi's config, not here"; exit 1; fi
      - name: every agent the docs name exists
        run: |
          names=$(sed -n 's/^name: *//p' agents/*.md; ls skills prompts | sed 's/\.md$//')
          fail=0
          while IFS=: read -r file name; do
            echo "$names" | grep -qx -- "$name" || { echo "$file names \`$name\` but no agent, skill or prompt has that name"; fail=1; }
          done < <(grep -roE '`(zstack|onigiri)-[a-z0-9-]+`' --include='*.md' skills prompts docs README.md AGENTS.md | tr -d '`' | sort -u)
          exit $fail
      - name: every skill and playbook the docs name exists
        run: |
          # A skill reference is /skill:x, ../x/SKILL.md, skills/x/, or a lowercase **x** / **`x`**.
          # Lowercase bold in these docs is reserved for skill and agent names, so a stray one fails here.
          # The skills vendored verbatim from pstack (docs/PROVENANCE.md) use bold as emphasis, so only their links are checked.
          verbatim='^skills/(statechart|create-formal-verification-skill|maintain-formal-verification-skill)/'
          agents=$(sed -n 's/^name: *//p' agents/*.md)
          fail=0
          while IFS=: read -r file ref; do
            name=$(echo "$ref" | sed -E 's#^\*\*`?##; s#`?\*\*$##; s#^/skill:##; s#^\.\./##; s#^skills/##; s#/SKILL\.md$##; s#/$##')
            [[ $ref == \*\** ]] && [[ $file =~ $verbatim ]] && continue
            [[ $ref == \*\** ]] && echo "$agents" | grep -qx -- "$name" && continue
            [ -f "skills/$name/SKILL.md" ] || { echo "$file names skill \`$name\` but skills/$name/SKILL.md does not exist"; fail=1; }
          done < <(grep -roE '\*\*`?[a-z]+(-[a-z]+)*`?\*\*|/skill:[a-z-]+|\.\./[a-z-]+/SKILL\.md|skills/[a-z-]+/' --include='*.md' skills prompts docs agents README.md AGENTS.md | sort -u)
          while IFS=: read -r file ref; do
            name=$(echo "$ref" | sed -E 's#^playbooks/##; s#\.md$##; s#^\(`##; s#`\)$##')
            [ -f "skills/onigiri-mode/playbooks/$name.md" ] || { echo "$file names playbook \`$name\` but skills/onigiri-mode/playbooks/$name.md does not exist"; fail=1; }
          done < <({ grep -roE 'playbooks/[a-z-]+\.md' --include='*.md' skills prompts docs agents README.md AGENTS.md || true; grep -HoE '\(`[a-z-]+`\)' skills/onigiri-mode/SKILL.md || true; } | sort -u)
          exit $fail

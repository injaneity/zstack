# zstack policy: the values the stack, the orchestrator and the services read, in one versioned file. Every reader goes
# through bin/policy, the one parser, which refuses an unknown, missing or mistyped key. The values here are an example
# deployment (a repo `acme/app`, an owner `Robin`, a login `octo`). A machine states its own in its own config
# directory and points ZSTACK_CONFIG at it; that directory replaces this one whole. The Hard rules' text is
# config/rules.toml and the runtime state files are config/state.toml, both read through bin/policy too.
schema = 1

# The provider and model each role runs on. `coding` is the thread that owns a task and writes all its code.
# `orchestrator` is the one scheduled thread per machine that plans work and launches coding threads
# (orchestrator/playbook.md). `explorer`, `designer` and `verifier` are the delegates a coding thread spawns; a list is
# a role with one seat per side of a race (`designer:1`, `designer:2`). The verifier never falls back to the parent's
# model when its seat fails; the other delegates do.
[models]
coding = { provider = "claude-code", model = "claude-opus-5-5" }
orchestrator = { provider = "claude-code", model = "claude-opus-5-5" }
explorer = { provider = "openai-codex", model = "gpt-6.1-terra" }
designer = [
  { provider = "claude-code", model = "claude-opus-5-5" },
  { provider = "openai-codex", model = "gpt-6.1-terra" },
]
verifier = { provider = "openai-codex", model = "gpt-6.1-terra" }

# How many red heads of one PR the orchestrator sends back to the thread that pushed them. Past that the PR is the owner's.
[ci]
fix_attempts = 3

# The longest a bash call that declares no timeout may run, in minutes (extensions/tool-guard), so a call blocked on a
# process that never ends returns to the session instead of hanging it.
[run]
idle_min = 150

# This machine, as the Hard rules name it (`work-path`, `work-holds`). `clone` is the checkout a session works from and
# `holds` the holds file it reads.
[host]
clone = "~/work/app"
holds = "~/zstack/hold-prs.txt"

# Who "we" are. `me` is the login whose PRs the merge job merges and the orchestrator counts as ours. `owner` is the
# person the rules and the services' messages name: the one whose calls the holds file relays.
[people]
me = "octo"
owner = "Robin"

# The patent hold at publish time (services/patent_push.py, the clone's pre-push hook; Hard rules, Patent hold). A change
# whose diff touches one of `held_words` is never pushed to `merge.repo`; it goes to `private_repo`. A word counts when
# no letter or digit comes before it, in any case. Generated lockfiles are skipped, path and lines.
[patent]
held_words = ["skyhook", "vaultkey", "sealing"]
skip_lockfiles = [
  "Cargo.lock", "package-lock.json", "npm-shrinkwrap.json", "pnpm-lock.yaml", "yarn.lock", "uv.lock", "poetry.lock",
  "pdm.lock", "Pipfile.lock", "bun.lock", "bun.lockb", "composer.lock", "Gemfile.lock", "go.sum", "flake.lock",
  "Package.resolved", "packages.lock.json", "gradle.lockfile", "pubspec.lock", "mix.lock",
]
private_repo = "acme/app-private"

# The merge gate (services/merge_job.py, the one merger in `repo`; Hard rules, Merging). The gate is three checks at the
# PR head: `gate_check` green, no hold row in the holds file, and a tier from `tiers` declared, with a preapprove row
# pinned to the head for a tier in `preapprove_tiers`. Under `floor_gb` free on its disk the job wakes the owner.
[merge]
repo = "acme/app"
gate_check = "ci-gate"
never_rerun = ["cla"]
tiers = ["light", "standard", "deep", "human"]
preapprove_tiers = ["deep", "human"]
floor_gb = 20

# The lines that link a salvage PR to what it replaces (Hard rules `salvage-fixes`): `salvaged_from` names the source
# PR and `fixes` is written once per issue the source fixes, so the forge closes the issue when the salvage merges.
[issues]
fixes = "Fixes #{issue}"
salvaged_from = "Salvaged from #{pr}"

# Where a service sends a wake for the owner (services/wake.py): a POST of one JSON object to `url`, with the bearer
# token read from `key_file`. An empty or missing key file sends nothing.
[wake]
url = "https://example.invalid/wake"
key_file = "~/.config/zstack/wake-key"

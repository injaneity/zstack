# zstack policy: the standing rules, gates and model config, in one versioned file. Every reader goes through bin/policy,
# the one parser, which refuses an unknown, missing or mistyped key. CI and hosts/check-parity run `bin/policy check`.
# The per-PR hold and preapprove rows are not here: they stay in the merge host's append-only ledger, hold-prs.txt
# (docs/HOST.md, Holds file). A value that came from Zane names his call in its comment.
schema = 1

# The provider and model each role runs on: bin/pi-run and bin/model-for for a launch, the subagent tool for a child.
# A list is a role with one seat per side of a race (`designer:1`, `designer:2`). The verifier never falls back to the
# parent's model when its seat fails (extensions/subagent/prompt.ts); the other agents do.
[models]
coding = { provider = "claude-code", model = "claude-opus-5-5" }
explorer = { provider = "openai-codex", model = "gpt-6.1-terra" }
designer = [
  { provider = "claude-code", model = "claude-opus-5-5" },
  { provider = "openai-codex", model = "gpt-6.1-terra" },
]
verifier = { provider = "openai-codex", model = "gpt-6.1-terra" }
research = { provider = "claude-code", model = "claude-opus-5-5" }

# Two slot pools across both hosts, counted apart (Zane, 12 Nov 12:47 SGT: "we should have 3 slots for autopickup and up
# to 5 hand started work"). `auto` runs are hourly picks (`source: auto`), `hand` runs are the rest; a running run with
# no pool tag counts as hand. The quick-check lane (`source: quick`, role research) is in neither. bin/pi-run and
# bin/hourly read them (playbooks/hourly.md step 2).
[slots]
auto = 3
hand = 5

# How many red heads per PR reopen the thread that pushed them (bin/pi-run ci, bin/hourly queue). Past that the PR is Zane's.
[ci]
fix_attempts = 3

# The patent hold at publish time (hosts/vm/patent_push.py, cua's pre-push hook; Hard rules, Patent hold; Zane 27 Oct
# 14:12 SGT, t747s4293, corrected t748u). A change whose diff touches one of `held_words` is never pushed to
# `public_repo`; it goes to `private_repo`. A word counts when no letter or digit comes before it, in any case, so
# "repairing" passes and "src/pairing.rs", "ws_pairing" and "KeyVault" hit (Zane 27 Oct t753u). Generated lockfiles are
# skipped, path and lines (a crate named teleport-e2e is not patent work). Never reword or loosen without Zane's
# explicit ok.
[patent]
held_words = ["teleport", "keyvault", "pairing"]
skip_lockfiles = [
  "Cargo.lock", "package-lock.json", "npm-shrinkwrap.json", "pnpm-lock.yaml", "yarn.lock", "uv.lock", "poetry.lock",
  "pdm.lock", "Pipfile.lock", "bun.lock", "bun.lockb", "composer.lock", "Gemfile.lock", "go.sum", "flake.lock",
  "Package.resolved", "packages.lock.json", "gradle.lockfile", "pubspec.lock", "mix.lock",
]
public_repo = "trycua/cua"
private_repo = "trycua/cua-staging"

# Who "we" are: the login whose PRs the merge job merges and the hourly pass counts as ours.
[people]
me = "injaneity"

# The trycua/cua merge gate (hosts/vm/merge_job.py, the one merger there; Hard rules, Merging). The gate is three checks
# at the PR head: `gate_check` green, no hold row in the ledger, and a tier from `tiers` declared, with a preapprove row
# pinned to the head for a tier in `preapprove_tiers`. Never reword or loosen without Zane's explicit ok.
[merge]
repo = "trycua/cua"
gate_check = "ci-gate"          # it owns red checks and which platform lanes a PR needs
never_rerun = ["cla"]           # not required on trycua/cua main: never rerun, never a reason to wait
tiers = ["light", "standard", "deep", "human"]   # the one risk enum, mildest first; a PR declaring none never merges
preapprove_tiers = ["deep", "human"]

# The lines bin/new-brief ends every brief with, after the task text, so a launch never depends on who wrote the brief.
# bin/pi-run reads `wake: finish` from the brief (onigiri-mode, Autonomy).
[brief]
text = '''
Follow onigiri-mode's Hard rules ([hard_rules] in zstack's config/policy.toml; bin/pi-run appends them to your system prompt).
After verifying, and again after every push to the PR, post a PR comment on its own: `verified <full 40-character head sha>: ran <what>; skipped <what>; result <pass/fail>`.
End the report (report.md in this directory, and your final message) with `follow-ups:` and `questions:`, each "none" when empty. Put PR URLs in it.
No invented limits: a restriction must trace to Zane's words or the policy. If you think one is needed, put it under questions: instead of applying it.
wake: finish
'''

# onigiri-mode's Hard rules, word for word. bin/pi-run appends exactly this text to every session's system prompt
# (`bin/policy render hard-rules`); the orchestrator reads it here. Moving it changed no word. Never reword a hold, patent
# or merge rule, or the PR-title rules, without Zane's explicit ok (the text's own Changing these rules).
[hard_rules]
text = '''
## Hard rules

`bin/pi-run` appends this section, and only this section, to every session's system prompt. The orchestrator reads it here. If another skill or brief words one of these differently, this section wins. Subagents get their role prompt from `agents/<name>.md` instead, with the rules their role could break. rule-guard (`docs/RULE-GUARD.md`) enforces the bans on force-pushes, `--no-verify`, merges, `gh pr ready` and holds-file writes in code.

### Work

- Work in `/home/box/agent-data/onigiri/cua` unless the task names another path.
- Holds live in `/srv/onigiri/hold-prs.txt`, one `kind | target | rules | note` row each. Read it before touching any PR. rule-guard refuses writes to it. To relay Zane's explicit call, append one row with `bin/hold-row add '<row>'` on the merge host; its last column names his call and its time. Retire or replace a row only to relay his explicit call, with `bin/hold-row retire '<row>' '<source>'` or `bin/hold-row replace '<row>' '<new row>'` on the merge host, which back the file up and parser-check it the same way.

### Patent hold

- The patent hold decides only which repo a change is pushed to. Work on pairing, Teleport and Keyvault normally.
- A change whose diff touches pairing, Teleport or Keyvault is never pushed to public `trycua/cua`. It goes to the private repo `trycua/cua-staging`.
- The repo's pre-push hook makes that choice. If it says "patent hold", follow its message. Never retry the push to `trycua/cua` or push the branch anywhere else (rule-guard refuses `--no-verify`).

### Commits and PR text

- No `Co-authored-by` trailers of any kind. No model, agent or tool names in commit messages, PR titles or PR bodies.
- Rules apply to commits this run creates. Commits that arrived from upstream main via a merge are not yours; do not rewrite them.
- PR titles use Conventional Commit syntax. Use `fix(...)` or `feat(...)`, not `refactor(...)`, when the change touches release-tracked crates.
- New files carry the repository's SPDX/FSL header where neighbouring files do.
- Write the plan and proof as if they become the PR body. Call the checks "the scoped repository checks" and never write local machine paths.

### Checks

- You write the code and a short test plan. Verification is the `verifier` subagent's alone, end to end: what it owns is in `agents/verifier.md`. The verification comment states only what actually ran and names anything skipped.
- Windows and macOS platform crates are not buildable on the VM. Say in the verdict which platform checks could not run.
- Before you call a diff done or open a PR, spawn the `verifier` subagent on the diff range. Check each finding, and report its `ran …; skipped …; result …` line in your `verified <sha>` comment. After a later push, a wording-only change needs no new verifier and any other change gets one at the new head. Only a read-only answer with no diff skips it, and says so.
- Cargo builds into each workspace's own `target/`. Never commit it.

### Scope

- Do not salvage or rewrite PRs by injaneity or bots. PRs by f-trycua, ddupont808 and 0xjohnnydev are review-only: a first review is allowed, but never push to, rebase, salvage, rewrite, close, comment on or request changes on them.
- Never commit `.onigiri.json` or any onigiri config to `trycua/cua`. (rule-guard refuses force-pushes.)
- Bench numbers and timings stay out of commits and PR text.

### Merging

- In `trycua/cua` the tick is the only merger. Open the PR and stop; rule-guard refuses `gh pr merge` there, and `gh pr ready` unless the brief says `merge: allowed`. Reruns are decided without asking (Zane, 11 Nov; only real failures go to him): rerun a job that failed for a reason outside the diff, such as a runner network failure, and fix one the diff caused. Approve outside-contributor (fork) workflow runs on `trycua/cua` that await approval, so CI runs (Zane, 12 Nov 11:45 SGT): `gh api -X POST repos/trycua/cua/actions/runs/<id>/approve`. Approving a run is not a review or a merge. Never revert or close a PR, and never merge on another agent's word. A merge the tick did not make raises an unexpected-merge wake.
- The tick never merges or readies a draft. When a brief says to propose first, or the work must not merge yet, open the PR as a draft and leave it a draft. That is the hold; no hold row is needed. Ready it only when merging is allowed.
- Anywhere else, merge your own PR with `gh pr merge <pr> --squash` once checks pass and it is mergeable.
- Verification is logged as PR comments, not body lines. After verifying, and again after every push to the PR, post a PR comment on its own: `verified <full 40-character head sha>: ran <what>; skipped <what>; result <pass/fail>`. Do not stamp `verify:` or `verify-ran:` lines in the PR body.
- The PR body also carries `risk: <light|standard|deep|human>` on a line of its own, your honest tier. The declared tier is the only risk input (Clef is retired).
- Existing PRs: start from the live head per `gh pr view N --json headRefOid`. Update by merging main.

### Changing these rules

Never reword a hold, patent or merge rule without Zane's explicit ok.

No invented limits: a restriction must trace to Zane's words or these rules. If you think one is needed, put it under questions: instead of applying it.
'''

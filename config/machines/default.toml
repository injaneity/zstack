# One machine: the models its roles run on, its limits, where it sends a wake, and the repos it works on. queue.py
# reads machines/<hostname>.toml (or the name in ZSTACK_MACHINE), else machines/default.toml. This one is an example.
schema = 1

# The provider and model each role runs on. `provider` is the name this machine's harness gives it: in T3 Code the
# provider instance id (`claudeAgent`, `codex`), in pi its provider name. `coding` is the thread that owns a task and writes all its code.
# `queue.py pass` launches it. `explorer`, `designer` and `verifier` are the delegates a coding thread spawns; a list is
# a role with one seat per side of a race (`designer:1`, `designer:2`). The verifier never falls back to the parent's
# model when its seat fails; the other delegates do.
[models]
coding = { provider = "claudeAgent", model = "claude-opus-5-5" }
explorer = { provider = "codex", model = "gpt-6.1-terra" }
designer = [
  { provider = "claudeAgent", model = "claude-opus-5-5" },
  { provider = "codex", model = "gpt-6.1-terra" },
]
verifier = { provider = "codex", model = "gpt-6.1-terra" }

# `idle_min` is the longest a bash call that declares no timeout may run, in minutes (pi/tool-guard.ts), so a call
# blocked on a process that never ends returns to the session instead of hanging it. `threads` is how many coding
# threads this machine works at once (queue.py pass launches none past it). `t3` is the T3 Code command `queue.py pass`
# starts and reads threads with: a name on PATH, or a path from / or ~/.
[run]
idle_min = 150
threads = 3
t3 = "t3"

# Where queue.py sends a wake for the owner: a POST of one JSON object to `url`, with the bearer
# token read from `key_file`. An empty or missing key file sends nothing.
[wake]
url = "https://example.invalid/wake"
key_file = "~/.config/zstack/wake-key"

# The repos this machine works on. `clone` is the checkout a thread works from, and `root` is where this machine keeps
# that repo's state: `queue.json` and `events.log`. The queue takes an issue or PR only when it
# carries one of `labels` (an empty list takes any label), and one that carries none of any machine's labels only
# when `unlabelled` is true. Give each machine labels that do not overlap, and set `unlabelled` on one machine.
[repos."acme/app"]
clone = "~/work/app"
root = "~/zstack/acme/app"
labels = []
unlabelled = true

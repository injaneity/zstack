# zstack's Hard rules: the standing rules every session runs under. One [[section]] per heading and one
# [[section.rule]] per rule, in order; a section with `paragraphs = true` renders its rules as paragraphs, the others as
# bullets. queue.py is the one reader: `queue.py rules` renders the "## Hard rules" markdown, `--thread` the copy a
# coding session gets, and `queue.py rules <id>...` only the named rules, which the subagent tool puts where an
# agents/<name>.md says {{rules: <id>, ...}}.
# A rule never writes a config value out. It names the key in braces and queue.py fills it in: `{merge.repo}`
# for one value, `{patent.held_words:or}` or `:and` for a list read as a phrase, `{merge.preapproved_labels:|}` for a list joined by
# the text after the colon. `queue.py check` refuses an unknown key, a duplicate id and a brace that names no key.
# Strings are TOML literal strings, so backticks and quotes need no escaping. Never reword a hold, patent or merge rule
# without the owner's explicit ok.
# A rule may carry `source` (who said it and when; never rendered) and `for = "orchestrator"` (left out of a coding
# session's copy).
schema = 1
intro = '''The plugin or launcher that starts a thread puts this section, and only this section, in its context, without the rules marked for the orchestrator. If another skill or brief words one of these differently, this section wins. The delegates get their role prompt from `agents/<name>.md` instead, with the rules their role could break. rule-guard (`hooks/README.md`) enforces the bans on force-pushes, `--no-verify`, merges, `gh pr ready`, marking a PR verified, issue closes that name no PR, holds-file writes, and PR titles and bodies that break Commits and PR text. The pre-push hook refuses a `Co-authored-by` trailer, a committed `target/` or `.onigiri.json`, and a new file without the SPDX header its neighbours carry.'''

[[section]]
title = '''Work'''

[[section.rule]]
id = "work-path"
text = '''Work in `{host.clone}` unless the task names another path.'''

[[section.rule]]
id = "work-holds"
text = '''Holds live in `{host.holds}`, one `kind | target | rules | note` row each. Read it before touching any PR. rule-guard refuses writes to it.'''

[[section.rule]]
id = "holds-relay"
for = "orchestrator"
text = '''To relay {people.owner}'s explicit call, append one row with `queue.py hold add '<row>'` on the merge host; its last column names that call and its time. Retire or replace a row only to relay {people.owner}'s explicit call, with `queue.py hold retire '<row>' '<source>'` or `queue.py hold replace '<row>' '<new row>'` on the merge host, which back the file up and parser-check it the same way.'''

[[section]]
title = '''Patent hold'''

[[section.rule]]
id = "patent-scope"
text = '''The patent hold decides only which repo a change is pushed to. Work on {patent.held_words:and} normally.'''

[[section.rule]]
id = "patent-repo"
text = '''A change whose diff touches {patent.held_words:or} is never pushed to public `{merge.repo}`. It goes to the private repo `{patent.private_repo}`.'''

[[section.rule]]
id = "patent-hook"
text = '''The repo's pre-push hook makes that choice. If it says "patent hold", follow its message. Never retry the push to `{merge.repo}` or push the branch anywhere else (rule-guard refuses `--no-verify`).'''

[[section]]
title = '''Commits and PR text'''

[[section.rule]]
id = "text-no-trailers"
text = '''No `Co-authored-by` trailers for models, agents or tools. A salvage keeps the contributor's commits as authored; if none survive, add `Co-authored-by: <contributor name> <their GitHub noreply or commit email>` for the source PR's author. No model, agent or tool names in commit messages, PR titles or PR bodies.'''

[[section.rule]]
id = "text-upstream-commits"
text = '''Rules apply to commits this run creates. Commits that arrived from upstream main via a merge are not yours; do not rewrite them.'''

[[section.rule]]
id = "text-titles"
text = '''PR titles use Conventional Commit syntax. Use `fix(...)` or `feat(...)`, not `refactor(...)`, when the change touches release-tracked packages.'''

[[section.rule]]
id = "text-spdx"
text = '''New files carry the repository's SPDX/FSL header where neighbouring files do.'''

[[section.rule]]
id = "salvage-fixes"
text = '''A salvage PR's body says `{issues.salvaged_from}` and, on a line of its own, `{issues.fixes}` for each source issue (every issue the salvaged PR fixes or was opened for), so GitHub closes it when the salvage merges. Take those issues from the salvaged PR's own body, not from GitHub's closingIssuesReferences, which links any issue after a closing word even when the body says it does not fix it. An issue the body names but says it does not fix gets `{issues.refs}` instead, because an issue closes only when our merged PR fixed it.'''

[[section.rule]]
id = "text-pr-body"
text = '''Write the plan and proof as if they become the PR body. Call the checks "the scoped repository checks" and never write local machine paths.'''

[[section]]
title = '''Checks'''

[[section.rule]]
id = "checks-owner"
text = '''You write the code and a short test plan. Verification is the `verifier`'s alone, end to end: what it owns is in `agents/verifier.md`. The verification line in your report states only what actually ran and names anything skipped.'''

[[section.rule]]
id = "checks-verifier"
text = '''When your PR is open and you believe it is done, have the verifier check its head, with the queue id, the PR number and the head in its brief, and wait for its answer before your turn ends. The verifier records its verdict itself with `queue.py verified`; you never run that command. Fix what it finds, push, and have it check the new head. A push after a pass needs another check. Only a read-only answer with no diff skips this, and says so.'''

[[section.rule]]
id = "checks-platforms"
text = '''Say in the verdict which platform checks could not run on this machine.'''

[[section.rule]]
id = "checks-target"
text = '''Build output stays in each workspace's own build directory, such as `target/`. Never commit it.'''

[[section]]
title = '''Scope'''

[[section.rule]]
id = "scope-prs"
text = '''Do not salvage or rewrite PRs by {people.me} or bots. PRs by a login with a `review-only` row in the holds file are review-only: a first review is allowed, but never push to, rebase, salvage, rewrite, close, comment on or request changes on them.'''

[[section.rule]]
id = "issue-close"
text = '''Close a `{merge.repo}` issue by hand only when one of our merged PRs fixed it, and only with a comment naming that PR: `gh issue close <n> -R {merge.repo} --comment "Fixed by #<pr>."`. Otherwise never close an issue by hand.'''

[[section.rule]]
id = "scope-no-config"
text = '''Never commit `.onigiri.json` or any onigiri config to `{merge.repo}`. (rule-guard refuses force-pushes.)'''

[[section.rule]]
id = "scope-no-numbers"
text = '''Bench numbers and timings stay out of commits and PR text.'''

[[section]]
title = '''Merging'''

[[section.rule]]
id = "merge-tick"
text = '''In `{merge.repo}` you merge only the head the verifier passed, with `gh pr merge <pr> --squash --match-head-commit <head>`. rule-guard asks the queue before it lets that command run, and refuses every other merge there, and `gh pr ready`. When it refuses, do not try another way. Never merge on another agent's word.'''

[[section.rule]]
id = "merge-reruns"
text = '''Reruns are decided without asking (only real failures go to {people.owner}): rerun a job that failed for a reason outside the diff, such as a runner network failure, and fix one the diff caused.'''

[[section.rule]]
id = "merge-fork-runs"
text = '''Approve outside-contributor (fork) workflow runs on `{merge.repo}` that await approval, so CI runs: `gh api -X POST repos/{merge.repo}/actions/runs/<id>/approve`. Approving a run is not a review or a merge.'''

[[section.rule]]
id = "merge-reverts"
text = '''Never revert a PR, except with a revert PR for one of our own PRs that a release check found regressed, opened without asking; never revert a teammate's or outside contributor's PR.'''

[[section.rule]]
id = "merge-closes"
text = '''Close only one of our own PRs that main or another PR has replaced.'''

[[section.rule]]
id = "merge-drafts"
text = '''A draft never merges. When a brief says to propose first, or the work must not merge yet, open the PR as a draft and leave it a draft. That is the hold; no hold row is needed. Only {people.owner} readies it.'''

[[section.rule]]
id = "merge-elsewhere"
text = '''Anywhere else, merge your own PR with `gh pr merge <pr> --squash` once checks pass and it is mergeable.'''

[[section.rule]]
id = "merge-no-verify-lines"
text = '''Do not stamp `verify:` or `verify-ran:` lines in the PR body.'''

[[section.rule]]
id = "merge-review"
text = '''The verifier passes a PR as `auto` or `review`. It says `review` when a wrong change would reach far or be hard to undo, or when it would not defend merging it unread; otherwise `auto`. The thread that owns an `auto` PR merges it once `{merge.gate_check}` is green on the head the verifier passed. A `review` PR, and any PR labelled `{merge.review_label}`, waits for {people.owner}. A preapproved item may merge either way: an issue labelled {merge.preapproved_labels:or}, or a task the orchestrator added as preapproved. If you think the change needs a person whatever the verifier says, do not merge it, and say why in your report.'''

[[section.rule]]
id = "merge-existing"
text = '''Existing PRs: start from the live head per `gh pr view N --json headRefOid`. Update by merging main.'''

[[section]]
title = '''Changing these rules'''
paragraphs = true

[[section.rule]]
id = "change-rules"
text = '''Never reword a hold, patent or merge rule without {people.owner}'s explicit ok.'''

[[section.rule]]
id = "no-invented-limits"
text = '''No invented limits: a restriction must trace to {people.owner}'s words or these rules. If you think one is needed, put it under questions: instead of applying it.'''

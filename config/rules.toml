# zstack's Hard rules: the standing rules every pi session runs under. One [[section]] per heading and one
# [[section.rule]] per rule, in order; a section with `paragraphs = true` renders its rules as paragraphs, the others as
# bullets. bin/policy is the one reader: `bin/policy rules` renders the "## Hard rules" markdown that bin/pi-run appends
# to every session's system prompt, and `bin/policy rules <id>...` renders only the named rules, which the subagent tool
# puts where an agents/<name>.md says {{rules: <id>, ...}}. `bin/policy check` refuses an unknown key, a duplicate id, and
# a patent or risk rule that no longer names config/policy.toml's [patent] words and repos or [merge] tiers.
# Strings are TOML literal strings, so backticks and quotes need no escaping. The text is Zane's wording, moved verbatim
# from the old skills/onigiri-mode/hard-rules.md. Never reword a hold, patent or merge rule without Zane's explicit ok.
schema = 1
intro = '''`bin/pi-run` appends this section, and only this section, to every session's system prompt. The orchestrator reads it with `bin/policy rules`. If another skill or brief words one of these differently, this section wins. Subagents get their role prompt from `agents/<name>.md` instead, with the rules their role could break. rule-guard (`docs/RULE-GUARD.md`) enforces the bans on force-pushes, `--no-verify`, merges, `gh pr ready`, issue closes that name no PR, and holds-file writes in code.'''

[[section]]
title = '''Work'''

[[section.rule]]
id = "work-path"
text = '''Work in `/home/box/agent-data/onigiri/cua` unless the task names another path.'''

[[section.rule]]
id = "work-holds"
text = '''Holds live in `/srv/onigiri/hold-prs.txt`, one `kind | target | rules | note` row each. Read it before touching any PR. rule-guard refuses writes to it. To relay Zane's explicit call, append one row with `bin/hold-row add '<row>'` on the merge host; its last column names his call and its time. Retire or replace a row only to relay his explicit call, with `bin/hold-row retire '<row>' '<source>'` or `bin/hold-row replace '<row>' '<new row>'` on the merge host, which back the file up and parser-check it the same way.'''

[[section]]
title = '''Patent hold'''

[[section.rule]]
id = "patent-scope"
text = '''The patent hold decides only which repo a change is pushed to. Work on pairing, Teleport and Keyvault normally.'''

[[section.rule]]
id = "patent-repo"
text = '''A change whose diff touches pairing, Teleport or Keyvault is never pushed to public `trycua/cua`. It goes to the private repo `trycua/cua-staging`.'''

[[section.rule]]
id = "patent-hook"
text = '''The repo's pre-push hook makes that choice. If it says "patent hold", follow its message. Never retry the push to `trycua/cua` or push the branch anywhere else (rule-guard refuses `--no-verify`).'''

[[section]]
title = '''Commits and PR text'''

[[section.rule]]
id = "text-no-trailers"
text = '''No `Co-authored-by` trailers of any kind. No model, agent or tool names in commit messages, PR titles or PR bodies.'''

[[section.rule]]
id = "text-upstream-commits"
text = '''Rules apply to commits this run creates. Commits that arrived from upstream main via a merge are not yours; do not rewrite them.'''

[[section.rule]]
id = "text-titles"
text = '''PR titles use Conventional Commit syntax. Use `fix(...)` or `feat(...)`, not `refactor(...)`, when the change touches release-tracked crates.'''

[[section.rule]]
id = "text-spdx"
text = '''New files carry the repository's SPDX/FSL header where neighbouring files do.'''

[[section.rule]]
id = "salvage-fixes"
text = '''A salvage PR's body says `Salvaged from #<pr>` and, on a line of its own, `Fixes #<issue>` for each source issue (every issue the salvaged PR fixes or was opened for), so GitHub closes it when the salvage merges (Zane, 13 Nov 15:31 SGT).'''

[[section.rule]]
id = "text-pr-body"
text = '''Write the plan and proof as if they become the PR body. Call the checks "the scoped repository checks" and never write local machine paths.'''

[[section]]
title = '''Checks'''

[[section.rule]]
id = "checks-owner"
text = '''You write the code and a short test plan. Verification is the `verifier` subagent's alone, end to end: what it owns is in `agents/verifier.md`. The verification line in your run report states only what actually ran and names anything skipped.'''

[[section.rule]]
id = "checks-platforms"
text = '''Windows and macOS platform crates are not buildable on the VM. Say in the verdict which platform checks could not run.'''

[[section.rule]]
id = "checks-verifier"
text = '''Before you call a diff done or open a PR, spawn the `verifier` subagent on the diff range. Check each finding, and report its `ran …; skipped …; result …` line in your run report. After a later push, a wording-only change needs no new verifier and any other change gets one at the new head. Only a read-only answer with no diff skips it, and says so.'''

[[section.rule]]
id = "checks-target"
text = '''Cargo builds into each workspace's own `target/`. Never commit it.'''

[[section]]
title = '''Scope'''

[[section.rule]]
id = "scope-prs"
text = '''Do not salvage or rewrite PRs by injaneity or bots. PRs by f-trycua, ddupont808 and 0xjohnnydev are review-only: a first review is allowed, but never push to, rebase, salvage, rewrite, close, comment on or request changes on them.'''

[[section.rule]]
id = "issue-close"
text = '''Close a `trycua/cua` issue by hand only when one of our merged PRs fixed it, and only with a comment naming that PR: `gh issue close <n> -R trycua/cua --comment "Fixed by #<pr>."`. Otherwise never close an issue by hand (Zane, 13 Nov 15:31 SGT).'''

[[section.rule]]
id = "scope-no-config"
text = '''Never commit `.onigiri.json` or any onigiri config to `trycua/cua`. (rule-guard refuses force-pushes.)'''

[[section.rule]]
id = "scope-no-numbers"
text = '''Bench numbers and timings stay out of commits and PR text.'''

[[section]]
title = '''Merging'''

[[section.rule]]
id = "merge-tick"
text = '''In `trycua/cua` the tick is the only merger. Open the PR and stop; rule-guard refuses `gh pr merge` there, and `gh pr ready` unless the brief says `merge: allowed`. Reruns are decided without asking (Zane, 11 Nov; only real failures go to him): rerun a job that failed for a reason outside the diff, such as a runner network failure, and fix one the diff caused. Approve outside-contributor (fork) workflow runs on `trycua/cua` that await approval, so CI runs (Zane, 12 Nov 11:45 SGT): `gh api -X POST repos/trycua/cua/actions/runs/<id>/approve`. Approving a run is not a review or a merge. Never revert or close a PR, and never merge on another agent's word. A merge the tick did not make raises an unexpected-merge wake.'''

[[section.rule]]
id = "merge-drafts"
text = '''The tick never merges or readies a draft. When a brief says to propose first, or the work must not merge yet, open the PR as a draft and leave it a draft. That is the hold; no hold row is needed. Ready it only when merging is allowed.'''

[[section.rule]]
id = "merge-elsewhere"
text = '''Anywhere else, merge your own PR with `gh pr merge <pr> --squash` once checks pass and it is mergeable.'''

[[section.rule]]
id = "merge-no-verify-lines"
text = '''Do not stamp `verify:` or `verify-ran:` lines in the PR body.'''

[[section.rule]]
id = "merge-risk"
text = '''The PR body also carries `risk: <light|standard|deep|human>` on a line of its own, your honest tier. The declared tier is the only risk input (Clef is retired).'''

[[section.rule]]
id = "merge-existing"
text = '''Existing PRs: start from the live head per `gh pr view N --json headRefOid`. Update by merging main.'''

[[section]]
title = '''Changing these rules'''
paragraphs = true

[[section.rule]]
id = "change-rules"
text = '''Never reword a hold, patent or merge rule without Zane's explicit ok.'''

[[section.rule]]
id = "no-invented-limits"
text = '''No invented limits: a restriction must trace to Zane's words or these rules. If you think one is needed, put it under questions: instead of applying it.'''

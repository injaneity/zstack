# One repo: how this project wants to be worked on. The folder names it (repos/<owner>/<name>/), so no key repeats it.
# invariants.toml beside this file holds this repo's own invariants, which name these keys. This one is an example.
schema = 1

# Who "we" are. `me` is the login the queue works for: its assigned issues and its requested reviews. `owner` is the
# person the invariants and the wake name. A PR by a `review_only` login gets a first review and nothing else, and an
# issue or PR by a `skip` login is never picked up.
[people]
me = "octo"
owner = "Robin"
review_only = ["f-teammate"]
skip = ["app/app-agents"]

# The patent hold at publish time (queue.py pre-push, the clone's pre-push hook; the repo invariant `patent`). Leave the
# whole section out, and that invariant, for a repo with no private twin. A change
# whose diff touches one of `held_words` is never pushed to `merge.repo`; it goes to `private_repo`. A word counts when
# no letter or digit comes before it, in any case. Generated lockfiles are skipped, path and lines. In a whole-line code
# comment, in that file's comment syntax, a word that is plain lowercase prose does not count; a capitalised, quoted or joined one
# (`Skyhook`, `skyhookCode`, `skyhook_id`, `app-skyhook`, `skyhook.rs`) still does, as does one the prose names as a thing
# (`named skyhook`, `the skyhook crate`).
[patent]
held_words = ["skyhook", "vaultkey", "sealing"]
skip_lockfiles = [
  "Cargo.lock", "package-lock.json", "npm-shrinkwrap.json", "pnpm-lock.yaml", "yarn.lock", "uv.lock", "poetry.lock",
  "pdm.lock", "Pipfile.lock", "bun.lock", "bun.lockb", "composer.lock", "Gemfile.lock", "go.sum", "flake.lock",
  "Package.resolved", "packages.lock.json", "gradle.lockfile", "pubspec.lock", "mix.lock",
]
private_repo = "acme/app-private"

# How a PR merges (queue.py; the invariants `merge-verified` and `held`). `gate_check` is the CI check that must be green on a head
# before its thread may merge it.
# The verifier passes a PR as `auto` or `review`. The thread merges an `auto` PR once `gate_check` is green on the
# verified head; a `review` PR waits for the owner. `review_label` on a PR forces `review`. A preapproved item may merge
# on either pass: an issue carrying one of `preapproved_labels`, or a task added with `--preapproved`. An issue or PR labelled
# `hold_label` is never started or merged, whatever else is true.
[merge]
gate_check = "ci-gate"
review_label = "needs-review"
preapproved_labels = ["preapproved"]
hold_label = "hold"

# The lines that link a salvage PR to what it replaces (a review item's brief says how): `salvaged_from` names the source
# PR and `fixes` is written once per issue the source fixes, so the forge closes the issue when the salvage merges.
[issues]
fixes = "Fixes #{issue}"
refs = "Refs #{issue}"
salvaged_from = "Salvaged from #{pr}"

# What a review of an outside contributor's PR does with a fixable one: `salvage` it as a new PR of ours that credits
# them, or `request-changes` on theirs.
[review]
outside = "salvage"

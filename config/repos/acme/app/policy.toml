# One repo: how this project wants to be worked on. The folder names it (repos/<owner>/<name>/), so no key repeats it.
# An optional rules.toml beside this file adds sections to the stack's Hard rules. This one is an example.
schema = 1

# How many red heads of one PR the orchestrator sends back to the thread that pushed them. Past that the PR is the owner's.
[ci]
fix_attempts = 3

# Who "we" are. `me` is the login whose PRs the merge job merges and the orchestrator counts as ours. `owner` is the
# person the rules and the services' messages name: the one whose calls the holds file relays.
[people]
me = "octo"
owner = "Robin"

# The patent hold at publish time (services/patent_push.py, the clone's pre-push hook; Hard rules, Patent hold). A change
# whose diff touches one of `held_words` is never pushed to `merge.repo`; it goes to `private_repo`. A word counts when
# no letter or digit comes before it, in any case. Generated lockfiles are skipped, path and lines.
[patent]
held_words = ["skyhook", "vaultkey", "sealing"]
skip_lockfiles = [
  "Cargo.lock", "package-lock.json", "npm-shrinkwrap.json", "pnpm-lock.yaml", "yarn.lock", "uv.lock", "poetry.lock",
  "pdm.lock", "Pipfile.lock", "bun.lock", "bun.lockb", "composer.lock", "Gemfile.lock", "go.sum", "flake.lock",
  "Package.resolved", "packages.lock.json", "gradle.lockfile", "pubspec.lock", "mix.lock",
]
private_repo = "acme/app-private"

# The merge gate (services/merge_job.py, the one merger in `repo`; Hard rules, Merging). The gate is three checks at the
# PR head: `gate_check` green, no hold row in the holds file, and a tier from `tiers` declared, with a preapprove row
# pinned to the head for a tier in `preapprove_tiers`. Under `floor_gb` free on its disk the job wakes the owner.
[merge]
gate_check = "ci-gate"
never_rerun = ["cla"]
tiers = ["light", "standard", "deep", "human"]
preapprove_tiers = ["deep", "human"]
floor_gb = 20

# The lines that link a salvage PR to what it replaces (Hard rules `salvage-fixes`): `salvaged_from` names the source
# PR and `fixes` is written once per issue the source fixes, so the forge closes the issue when the salvage merges.
[issues]
fixes = "Fixes #{issue}"
salvaged_from = "Salvaged from #{pr}"

# What a review of an outside contributor's PR does with a fixable one: `salvage` it as a new PR of ours that credits
# them, or `request-changes` on theirs.
[review]
outside = "salvage"

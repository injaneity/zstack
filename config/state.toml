# zstack's runtime state: every file the services and the orchestrator keep under a machine's $ONIGIRI_ROOT, one
# [file.<name>] each. This file is the schema, not the data: the data stays on the machine. Each entry names its path
# under the root, the host that keeps it, its format, the one module that writes it, the modules that read it, and the
# shape of one record. bin/policy validates it, and tests/test_declarative.py checks that each writer and reader named
# here still names its file. A new state file is declared here in the same change that adds it.
# Formats: json (one object, replaced whole), toml, rows (`a | b | c` lines, # comments), lines (append-only text),
# tsv (append-only tab-separated), mark (presence is the state, its text a reason), lock (flock only).
schema = 1

[file.holds]
path = "hold-prs.txt"
host = "merge host"
format = "rows"
writer = "bin/hold-row"   # and the owner by hand; rule-guard refuses every other write (docs/RULE-GUARD.md)
readers = ["services/merge_job.py", "extensions/rule-guard/holds.ts"]
schema = "kind | target | rules | note; kinds hold, preapprove, hands-off-path, skip-author, review-only"

[file.holds-lock]
path = ".hold-row.lock"
host = "merge host"
format = "lock"
writer = "bin/hold-row"
readers = ["bin/hold-row"]
schema = "flock only: one holds-file write at a time; each write leaves hold-prs.txt.bak-<time> beside it"

[file.events]
path = "events.log"
host = "merge host"
format = "lines"
writer = "services/merge_job.py"   # and the patent hook's patent-held lines (services/patent_push.py)
readers = ["services/merge_job.py", "services/patent_push.py"]
schema = "<iso ts> <kind> <id> <reason>, one per decision, append-only"

[file.merge-state]
path = "tick/state.json"
host = "merge host"
format = "json"
writer = "services/merge_job.py"
readers = ["services/merge_job.py"]
schema = "the merge job's per-PR memory: reruns, landed heads, sent wakes, the merge-watch window"

[file.merge-last-run]
path = "tick/last-run"
host = "merge host"
format = "lines"
writer = "services/merge_job.py"
readers = ["the orchestrator"]
schema = "`<iso ts> zstack <sha> ok|<n> error(s)[ paused]`, the last finished run"

[file.merge-paused]
path = "tick/PAUSED"
host = "merge host"
format = "mark"
writer = "the owner, by hand"
readers = ["services/merge_job.py"]
schema = "present: no merges or reruns; its first line is the reason"

[file.cron-log]
path = "tick/cron.log"
host = "merge host"
format = "lines"
writer = "services/cron-wrap.sh"
readers = ["the owner, by hand"]
schema = "start, end, skip and TIMEOUT lines per cron job; tick/cron-<name>.started holds each job's last start"
